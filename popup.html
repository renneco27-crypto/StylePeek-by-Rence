<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Website Code Extractor &amp; Hybrid Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      font-family: 'Raleway', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1e1e24;
      color: #e4e4e8;
      padding: 18px 20px 18px;
      position: relative;
      user-select: none;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #3a3a44, #56566a, #3a3a44);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #d8d8e0;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 4px;
      background: #2b2b34;
      color: #a8a8b8;
      border: 1px solid #3a3a44;
    }

    .section {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #2c2c36;
    }

    .section:last-of-type {
      margin-bottom: 10px;
      padding-bottom: 0;
      border-bottom: none;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #8c8c9c;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    button {
      width: 100%;
      padding: 10px 14px;
      background: linear-gradient(180deg, #e8e8ec 0%, #dcdce2 100%);
      color: #1e1e24;
      font-family: 'Raleway', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow:
        0 3px 0 #9a9aa4,
        0 4px 12px rgba(0, 0, 0, 0.35);
      transition: all 0.12s ease;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    button:last-child {
      margin-bottom: 0;
    }

    button:hover:not(:disabled) {
      background: linear-gradient(180deg, #f2f2f6 0%, #e4e4ea 100%);
      transform: translateY(-1px);
      box-shadow:
        0 4px 0 #9a9aa4,
        0 6px 16px rgba(0, 0, 0, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow:
        0 1px 0 #9a9aa4,
        0 2px 6px rgba(0, 0, 0, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    button.btn-secondary {
      background: linear-gradient(180deg, #32323c 0%, #282830 100%);
      color: #e4e4e8;
      border: 1px solid #444452;
      box-shadow:
        0 3px 0 #141418,
        0 4px 10px rgba(0, 0, 0, 0.35);
    }

    button.btn-secondary:hover:not(:disabled) {
      background: linear-gradient(180deg, #3c3c48 0%, #30303a 100%);
      box-shadow:
        0 4px 0 #141418,
        0 6px 14px rgba(0, 0, 0, 0.4);
    }

    button.btn-secondary:active:not(:disabled) {
      box-shadow:
        0 1px 0 #141418,
        0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn-row button {
      margin-bottom: 0;
      padding: 9px 8px;
      font-size: 11px;
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #a8a8b8;
      margin-bottom: 8px;
      padding: 2px 2px;
    }

    .options-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .options-row input[type="checkbox"] {
      accent-color: #dcdce2;
      cursor: pointer;
    }

    #statusText {
      font-size: 11px;
      font-weight: 600;
      color: #b4b4c4;
      background: #16161b;
      border: 1px solid #2e2e38;
      border-radius: 5px;
      padding: 8px 10px;
      text-align: center;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.35;
    }

    #statusText.status-ok {
      color: #d8f3dc;
      border-color: #3b6e4c;
      background: #19271e;
    }

    #statusText.status-err {
      color: #ffccd5;
      border-color: #7a2e3b;
      background: #2a181c;
    }

    input[type="file"] {
      display: none;
    }
  </style>
  <script src="dist/jszip.min.js"></script>
</head>
<body>
  <div class="header">
    <h1>Website Code Extractor</h1>
    <span class="badge">v2.0 Hybrid</span>
  </div>

  <!-- 1. Website Code Extractor + Auto-Scroll + zip2html -->
  <div class="section">
    <div class="section-title">
      <span>1. Scroll &amp; Extract Website</span>
      <span>ZIP / HTML</span>
    </div>
    <div class="options-row">
      <label title="Automatically scroll down the page before extracting so lazy-loaded sections and images render">
        <input type="checkbox" id="autoScrollToggle" checked>
        Auto-Scroll Lazy Content
      </label>
      <label title="Keep <script> tags when converting to standalone HTML">
        <input type="checkbox" id="keepScriptsToggle">
        Keep Scripts
      </label>
    </div>
    <button id="extractHtmlButton" title="Scroll page, extract all assets, and inline into ONE self-contained offline .html file via zip2html">
      Scroll &amp; Extract Single .HTML
    </button>
    <div class="btn-row">
      <button id="extractButton" class="btn-secondary" title="Scroll page and download full folder structure as .ZIP">
        Extract .ZIP
      </button>
      <button id="zipToHtmlButton" class="btn-secondary" title="Convert any saved website .ZIP archive into a single self-contained .HTML file (zip2html.py)">
        ZIP &#8594; .HTML
      </button>
    </div>
    <input type="file" id="zipFileInput" accept=".zip,application/zip">
  </div>

  <!-- 2. Element & Page Code Capture Toolbar (fkmaohpngenfoccdgceedjkfhkdcohmg) -->
  <div class="section">
    <div class="section-title">
      <span>2. Element &amp; Code Capture</span>
      <span>Clipboard + HTML</span>
    </div>
    <button id="h2dSelectElementBtn" title="Pick any element on the page to copy its standalone HTML + CSS code directly to the clipboard">
      Select Element &#8594; Copy Code
    </button>
    <div class="btn-row">
      <button id="h2dCaptureToolbarBtn" class="btn-secondary" title="Open the floating Capture Toolbar (Capture Code, Capture Design, Select Element)">
        Capture Toolbar
      </button>
      <button id="copyLastCodeBtn" class="btn-secondary" title="Copy the last captured element/page HTML+CSS code to clipboard">
        Copy Last Code
      </button>
    </div>
  </div>

  <!-- 3. Live Website Dragging & Design Fixing (kdmdoinnkaeognnpegpkepdnggeaodkn VisBug + StylePeek) -->
  <div class="section">
    <div class="section-title">
      <span>3. Live Drag &amp; Fix Elements</span>
      <span>VisBug + Studio</span>
    </div>
    <button id="visbugToggleBtn" title="Toggle VisBug live element dragging, position/margin/padding guides, and live design fixing">
      Toggle VisBug Drag &amp; Fix
    </button>
    <div class="btn-row">
      <button id="stylepeekInspectBtn" class="btn-secondary" title="Open StylePeek Inspector &amp; Code Drawer">
        Inspector Drawer
      </button>
      <button id="stylepeekDragBtn" class="btn-secondary" title="Toggle StylePeek Free-Drag &amp; Resize Mode">
        Free-Drag Mode
      </button>
    </div>
  </div>

  <div id="statusText">Ready — Choose an extraction or live design tool</div>

  <script src="popup.js"></script>
</body>
</html>
