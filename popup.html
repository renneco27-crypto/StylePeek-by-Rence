<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>stylepeek_by_rence</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: var(--font-body, 'Inter', sans-serif);
      background-color: var(--color-paper, #F4F3EE);
      color: var(--color-ink, #1C1C1E);
      padding: 16px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Bare Top Header (Law 4b: No card, no button boxes, pure icon + typography) */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-rule, #DCD9CE);
      margin-bottom: 14px;
    }

    .brand-title {
      font-family: var(--font-display, 'Plus Jakarta Sans', sans-serif);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .state-indicator {
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 10px;
      font-weight: 600;
      color: var(--color-ink-2, #78716C);
    }

    .state-indicator.active {
      color: #166534;
    }

    /* Tactile Mode Switcher (CTRL+SPC Segmented Control) */
    .segmented-control {
      display: flex;
      background: var(--color-paper-2, #EAE8E0);
      border: 1px solid var(--color-rule, #DCD9CE);
      border-radius: 9px;
      padding: 3px;
      gap: 3px;
      margin-bottom: 16px;
    }

    .segment-tab {
      flex: 1;
      padding: 7px 0;
      border: none;
      background: transparent;
      color: var(--color-ink-2, #78716C);
      font-family: var(--font-display, 'Plus Jakarta Sans', sans-serif);
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.12s ease;
      box-shadow: none;
      margin: 0;
    }

    .segment-tab.active {
      background: var(--color-surface, #FAF9F6);
      color: var(--color-ink, #1C1C1E);
      box-shadow: 0 1px 3px rgba(28, 28, 30, 0.1);
    }

    /* Views container */
    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    /* Single Primary Tactile Button (Law 4 & Law 9) */
    button.btn-primary {
      width: 100%;
      padding: 11px 16px;
      background: var(--color-accent, #C84B44);
      color: #FAF9F6;
      font-family: var(--font-display, 'Plus Jakarta Sans', sans-serif);
      font-weight: 800;
      font-size: 12.5px;
      border: 1px solid #A83832;
      border-radius: 9px;
      cursor: pointer;
      box-shadow:
        0 3px 0 #8F2D28,
        0 5px 12px rgba(200, 75, 68, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    button.btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #8F2D28;
    }

    /* Law 4e & Law 9: Secondary actions are bolded clickable text with hover transition */
    .secondary-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 2px 10px;
    }

    .action-link {
      background: none;
      border: none;
      color: var(--color-ink, #1C1C1E);
      font-family: var(--font-display, 'Plus Jakarta Sans', sans-serif);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      box-shadow: none;
      margin: 0;
      text-align: left;
    }

    .action-link:hover {
      color: var(--color-accent, #C84B44);
    }

    .action-link span.arrow {
      color: var(--color-ink-2, #78716C);
      font-weight: 600;
      transition: transform 0.12s ease;
    }

    .action-link:hover span.arrow {
      transform: translateX(3px);
      color: var(--color-accent, #C84B44);
    }

    /* Progressive Disclosure Details */
    details {
      margin-top: 10px;
      border-top: 1px solid var(--color-rule, #DCD9CE);
      padding-top: 10px;
    }

    summary {
      font-size: 11px;
      font-weight: 700;
      color: var(--color-ink-2, #78716C);
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    summary:hover {
      color: var(--color-ink, #1C1C1E);
    }

    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      padding: 2px 0;
    }

    .options-stack label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--color-ink, #1C1C1E);
      cursor: pointer;
    }

    .options-stack input[type="checkbox"] {
      accent-color: var(--color-accent, #C84B44);
    }

    /* Minimal status line */
    .status-bar {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--color-rule, #DCD9CE);
      font-family: var(--font-mono, 'JetBrains Mono', monospace);
      font-size: 10.5px;
      color: var(--color-ink-2, #78716C);
      text-align: center;
      min-height: 20px;
    }

    .status-bar.ok {
      color: #166534;
      font-weight: 600;
    }

    .status-bar.err {
      color: #991B1B;
      font-weight: 600;
    }

    input[type="file"] {
      display: none;
    }

    svg.ico {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* Palette Tab UI (Tactile CTRL+SPC) */
    .palette-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .palette-site-info {
      font-family: var(--font-mono, monospace);
      font-size: 10px;
      font-weight: 600;
      color: var(--color-ink-2, #78716C);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-text-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--color-ink-2, #78716C);
      font-family: var(--font-display, sans-serif);
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      box-shadow: none;
      margin: 0;
    }

    .icon-text-btn:hover {
      color: var(--color-ink, #1C1C1E);
    }

    .palette-filter-pills {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
      overflow-x: auto;
      padding: 2px 0;
    }

    .filter-pill {
      background: var(--color-paper-2, #EAE8E0);
      border: 1px solid var(--color-rule, #DCD9CE);
      border-radius: 9999px;
      padding: 3px 8px;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--color-ink-2, #78716C);
      cursor: pointer;
      white-space: nowrap;
      box-shadow: none;
      margin: 0;
      transition: all 0.1s ease;
    }

    .filter-pill:hover {
      color: var(--color-ink, #1C1C1E);
    }

    .filter-pill.active {
      background: var(--color-ink, #1C1C1E);
      color: #FAF9F6;
      border-color: #1C1C1E;
    }

    .popup-palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      max-height: 155px;
      min-height: 90px;
      overflow-y: auto;
      padding: 3px;
      margin-bottom: 10px;
      background: var(--color-paper-2, #EAE8E0);
      border: 1px solid var(--color-rule, #DCD9CE);
      border-radius: 9px;
    }

    .popup-swatch-item {
      height: 38px;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      transition: transform 0.08s ease, border-color 0.08s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .popup-swatch-item:hover {
      transform: translateY(-2px);
      border-color: var(--color-ink, #1C1C1E);
      z-index: 2;
    }

    .popup-swatch-item.active {
      outline: 2px solid var(--color-accent, #C84B44);
      outline-offset: 1px;
    }

    .popup-swatch-hex {
      font-family: var(--font-mono, monospace);
      font-size: 8px;
      font-weight: 700;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      color: #FFFFFF;
      padding: 1px 0;
      line-height: 1.1;
      width: 100%;
    }

    .popup-color-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--color-surface, #FAF9F6);
      border: 1px solid var(--color-rule, #DCD9CE);
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .popup-color-dot {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
    }

    .popup-color-meta {
      flex: 1;
      margin-left: 8px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .popup-color-hex {
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      font-weight: 800;
      color: var(--color-ink, #1C1C1E);
    }

    .popup-color-role {
      font-family: var(--font-mono, monospace);
      font-size: 9.5px;
      color: var(--color-ink-2, #78716C);
    }

    .popup-copy-btn {
      background: var(--color-paper-2, #EAE8E0);
      border: 1px solid var(--color-rule, #DCD9CE);
      border-radius: 5px;
      padding: 3px 8px;
      font-family: var(--font-display, sans-serif);
      font-size: 10px;
      font-weight: 700;
      color: var(--color-ink, #1C1C1E);
      cursor: pointer;
      box-shadow: none;
      margin: 0;
    }

    .popup-copy-btn:hover {
      background: var(--color-surface, #FAF9F6);
      border-color: var(--color-ink, #1C1C1E);
    }
  </style>
  <script src="dist/jszip.min.js"></script>
  <script src="technologies.js"></script>
</head>
<body>

  <!-- Bare Header (Law 4b) -->
  <div class="header">
    <div class="brand-title">stylepeek_by_rence</div>
    <div id="statusPill" class="state-indicator">Ready</div>
  </div>

  <!-- 4 Clean Modes (Tactile Control) -->
  <div class="segmented-control">
    <button class="segment-tab active" data-tab="edit">Edit</button>
    <button class="segment-tab" data-tab="capture">Capture</button>
    <button class="segment-tab" data-tab="palette">Palette</button>
    <button class="segment-tab" data-tab="export">Export</button>
  </div>

  <!-- TAB 1: EDIT PAGE (Layers & Backgrounds) -->
  <div id="view-edit" class="view-panel active">
    <!-- One Obvious Primary CTA (Law 4 & Law 9) -->
    <button id="btnLaunchStudio" class="btn-primary">
      <svg class="ico" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      Launch Studio &amp; Layers
    </button>
  </div>

  <!-- TAB 2: CAPTURE (Components & Code) -->
  <div id="view-capture" class="view-panel">
    <!-- One Obvious Primary CTA -->
    <button id="btnCaptureElement" class="btn-primary">
      <svg class="ico" viewBox="0 0 24 24"><path d="M4 4l7.07 17 2.51-7.39L21 11.07z"/><path d="M14 14l6 6"/></svg>
      Select Element to Copy
    </button>

    <div class="secondary-actions">
      <!-- Open Component Preview commented out
      <button id="btnOpenPreview" class="action-link">
        <span>Open Component Preview</span>
        <span class="arrow">&rarr;</span>
      </button>
      -->
      <button id="btnCopyLastCode" class="action-link">
        <span>Copy Last Code to Clipboard</span>
        <span class="arrow">&rarr;</span>
      </button>
      <button id="btnToggleFigmaBar" class="action-link">
        <span>Toggle Floating Capture Bar</span>
        <span class="arrow">&rarr;</span>
      </button>
      <button id="btnCapturePalette" class="action-link">
        <span>Website Color Palette</span>
        <span class="arrow">&rarr;</span>
      </button>
    </div>
  </div>

  <!-- TAB 3: PALETTE (Website Color Picker & Tokens) -->
  <div id="view-palette" class="view-panel">
    <!-- Primary CTA: Eyedropper / Pick Color from page -->
    <button id="btnPopupEyedropper" class="btn-primary">
      <svg class="ico" viewBox="0 0 24 24"><path d="m14 2 4 4L7 17H3v-4L14 2z"/><path d="m13 3 4 4"/><circle cx="18" cy="19" r="3"/><path d="m9 15 2 2"/></svg>
      Pick Color from Website
    </button>

    <div class="palette-header-row">
      <div id="popupPaletteSiteInfo" class="palette-site-info">Detecting website colors...</div>
      <button id="btnPopupRescanPalette" class="icon-text-btn" title="Rescan page colors">
        <svg class="ico" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span>Rescan</span>
      </button>
    </div>

    <!-- Quick Role Filter Pills -->
    <div class="palette-filter-pills" id="popupPaletteFilter">
      <button class="filter-pill active" data-filter="all">All</button>
      <button class="filter-pill" data-filter="dominant">Dominant</button>
      <button class="filter-pill" data-filter="surfaces">Surfaces</button>
      <button class="filter-pill" data-filter="accents">Accents</button>
      <button class="filter-pill" data-filter="text">Text</button>
    </div>

    <!-- Swatches Grid (compact, scrollable, tactile) -->
    <div id="popupPaletteGrid" class="popup-palette-grid">
      <!-- Injected swatches -->
    </div>

    <!-- Active Swatch Inspector Pill -->
    <div id="popupSelectedColorBar" class="popup-color-bar" style="display:none;">
      <div id="popupSelectedColorPreview" class="popup-color-dot"></div>
      <div class="popup-color-meta">
        <span id="popupSelectedColorHex" class="popup-color-hex">#000000</span>
        <span id="popupSelectedColorRole" class="popup-color-role">Dominant</span>
      </div>
      <button id="btnCopySelectedHex" class="popup-copy-btn" title="Copy HEX">Copy</button>
    </div>

    <div class="secondary-actions">
      <button id="btnOpenFullPaletteStudio" class="action-link">
        <span>Launch Full Palette Studio</span>
        <span class="arrow">&rarr;</span>
      </button>
      <button id="btnCopyPaletteCss" class="action-link">
        <span>Copy as CSS Variables</span>
        <span class="arrow">&rarr;</span>
      </button>
      <button id="btnCopyPaletteTailwind" class="action-link">
        <span>Copy as Tailwind Config</span>
        <span class="arrow">&rarr;</span>
      </button>
    </div>
  </div>

  <!-- TAB 4: EXPORT (Full Site & Apps) -->
  <div id="view-export" class="view-panel">
    <!-- One Obvious Primary CTA -->
    <button id="btnExportHtml" class="btn-primary">
      <svg class="ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download Site as .HTML
    </button>

    <div class="secondary-actions">
      <button id="btnExportZip" class="action-link">
        <span>Download Full Site .ZIP</span>
        <span class="arrow">&rarr;</span>
      </button>
      <button id="btnDetectTech" class="action-link">
        <span>Detect Tech Stack</span>
        <span class="arrow">&rarr;</span>
      </button>
      <button id="btnBuildAndroid" class="action-link">
        <span>Create Offline Android App</span>
        <span class="arrow">&rarr;</span>
      </button>
    </div>

    <!-- Progressive Disclosure for Advanced Export Options (Law 6 & Part 2 Rule 3) -->
    <details>
      <summary><span>Options</span></summary>
      <div class="options-stack">
        <label><input type="checkbox" id="autoScrollToggle" checked> Auto-Scroll &amp; Render</label>
        <label><input type="checkbox" id="treeCrawlToggle" checked> Capture Button States</label>
        <label><input type="checkbox" id="scrapeLinksToggle"> Include Linked Pages</label>
        <label><input type="checkbox" id="keepScriptsToggle"> Keep Scripts</label>
      </div>
    </details>
  </div>

  <!-- Minimal status output (Law 2: Earned copy only) -->
  <div id="statusText" class="status-bar">Ready</div>

  <input type="file" id="zipFileInput" accept=".zip,application/zip">
  <input type="file" id="parentFolderPicker" webkitdirectory directory multiple>

  <script src="js/sp_android_export.js"></script>
  <script src="popup.js"></script>
</body>
</html>
